databases:
  - name: judge-arena-db
    plan: free
    databaseName: judgearena
    user: judgearena

services:
  - type: web
    name: judge-arena
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: judge-arena-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JUDGE0_URL
        value: https://ce.judge0.com
      - key: JUDGE0_AUTH_TOKEN
        sync: false
